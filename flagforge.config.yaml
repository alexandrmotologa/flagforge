flags:
  new-dashboard-ui:
    key: new-dashboard-ui
    name: New Dashboard UI (v2)
    description: Next-generation analytics overview with real-time stream cards
    type: boolean
    enabled: true
    defaultValue: false
    defaultVariant: "off"
    variants:
      "on": true
      "off": false
    rules:
      - id: internal-employees
        description: Enable for internal company accounts
        conditions:
          - property: email
            operator: matches_regex
            value: ".*@(flagforge\\.dev|company\\.com)$"
        serve:
          variant: "on"
      - id: beta-testers
        description: Enable for users in beta tier in MD & EU
        conditions:
          - property: tier
            operator: in
            value: [beta, vip, enterprise]
          - property: country
            operator: in
            value: [MD, RO, DE, FR]
        serve:
          variant: "on"
    rollout:
      percentage: 25
      stickinessProperty: userId
      salt: dash_salt_2026
    canaryStage: beta_25
    lifecycle: canary
    tags: [frontend, ui, canary]
    createdAt: "2026-01-10T10:00:00.000Z"
    updatedAt: "2026-01-15T14:30:00.000Z"

